<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>針猛</title>
<meta name="description" content="記錄每週施打的時間、部位與劑量，並提醒你輪替部位。">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="針猛">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* iOS grouped-list look: large title, inset rounded groups on a gray ground, system blue for actions */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --on-blue:#FFFFFF;
  --seg-sel:#FFFFFF; --bar:rgba(242,242,247,.82);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1C1C1E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158;
  --seg-sel:#636366; --bar:rgba(22,22,24,.82); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* compact nav bar that fades in on scroll */
.nav{position:fixed;top:0;left:0;right:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;opacity:0;pointer-events:none;transition:opacity .2s,border-color .2s}
.nav.show{opacity:1;border-bottom-color:var(--sep)}
.nav div{height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px}

.wrap{max-width:600px;margin:0 auto;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.date{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;margin:14px 0 0}
h1{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:.01em;margin:0 0 14px;line-height:1.2}

.sec-h{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:var(--label2);padding:0 16px 7px;margin-top:28px;gap:10px}
.sec-h .act{background:none;border:0;color:var(--blue);font-size:15px;padding:0;cursor:pointer}
.sec-f{font-size:13px;color:var(--label2);padding:7px 16px 0;margin:0}
.sec-f b{font-weight:600;color:var(--label)}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.pad{padding:14px 16px}

/* summary */
.sum{display:flex;align-items:center;gap:16px;padding:16px}
.sum .txt{flex:1;min-width:0}
.sum .k{font-size:15px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:6px}
.sum .k svg{width:16px;height:16px}
.sum .big{font-family:var(--font-r);font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.sum .big small{font-family:var(--font);font-size:17px;font-weight:600;color:var(--label2);margin-left:6px}
.sum .st{font-size:15px;color:var(--label2);margin-top:2px}
.sum .st.warn{color:var(--orange);font-weight:600}
.sum .st.bad{color:var(--red);font-weight:600}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--fill)}
.ring .pr{stroke:var(--blue);transition:stroke-dashoffset .5s ease}
.ring.warn .pr{stroke:var(--orange)} .ring.bad .pr{stroke:var(--red)}
.ring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-r);font-weight:700;font-size:20px;line-height:1}
.ring span small{font-family:var(--font);font-size:10px;font-weight:600;color:var(--label2);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.stats>div{padding:11px 16px}
.stats>div+div{border-left:.5px solid var(--sep)}
.stats .k{font-size:13px;color:var(--label2)}
.stats .v{font-family:var(--font-r);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stats .v small{font-family:var(--font);font-size:15px;font-weight:600;color:var(--label2);margin-left:3px}

/* site tiles */
.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.site{position:relative;background:var(--fill2);border:0;border-radius:12px;padding:12px 14px;min-height:68px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:transform .12s,background-color .15s}
.site:active{transform:scale(.96)}
.site .nm{font-size:17px;font-weight:600}
.site .m{font-size:13px;color:var(--label2)}
.site .badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.site.rec .badge{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.site.last .badge{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
.site.sel{background:var(--blue);color:var(--on-blue)}
.site.sel .m{color:rgba(255,255,255,.8)}
.site.sel .badge{color:#fff;background:rgba(255,255,255,.22)}
.site .ck{position:absolute;bottom:10px;right:12px;width:20px;height:20px;opacity:0;transform:scale(.6);transition:.15s}
.site.sel .ck{opacity:1;transform:none}

/* segmented control */
.seg-wrap{padding:0 16px 14px}
.seg-l{font-size:13px;color:var(--label2);margin:0 0 7px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--fill);border-radius:9px;padding:2px;gap:2px;position:relative}
.seg button{border:0;background:transparent;border-radius:7px;height:34px;font-size:15px;font-weight:500;cursor:pointer;font-variant-numeric:tabular-nums;position:relative;transition:background-color .15s}
.seg button.sel{background:var(--seg-sel);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.seg button .u{font-size:12px;color:var(--label2);margin-left:2px;font-weight:500}
.seg button .dot{position:absolute;top:5px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--label3)}

/* form rows */
.rows{border-top:.5px solid var(--sep);margin-left:16px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding-right:16px}
.frow+.frow{border-top:.5px solid var(--sep)}
.frow label{font-size:17px;flex:none}
.frow input{border:0;background:transparent;color:var(--label);font:inherit;font-size:17px;text-align:right;min-width:0;flex:1;padding:10px 0;-webkit-appearance:none;appearance:none}
.frow input::placeholder{color:var(--label3)}
.frow input[type=datetime-local]{color:var(--blue);display:flex;justify-content:flex-end}
.frow input[type=datetime-local]::-webkit-date-and-time-value{text-align:right}

.primary{display:block;width:100%;margin-top:16px;height:50px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .12s}
.primary:active{opacity:.8;transform:scale(.99)}

/* history list */
.log{list-style:none;margin:0;padding:0}
.log .mon{font-size:13px;color:var(--label2);padding:18px 16px 7px;display:flex;justify-content:space-between;background:var(--bg)}
.log .mon:first-child{padding-top:0}
.log .grp{background:var(--card);border-radius:12px;overflow:hidden;list-style:none;margin:0;padding:0}
.ent+.ent .ent-main{box-shadow:inset 0 .5px 0 var(--sep);}
.ent-main{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border:0;text-align:left;cursor:pointer}
.ent-main:active{background:var(--fill2)}
.ico{width:36px;height:36px;border-radius:9px;background:color-mix(in srgb,var(--blue) 14%,transparent);display:grid;grid-template-columns:repeat(2,7px);gap:3px;place-content:center;flex:none}
.ico i{width:7px;height:7px;border-radius:2px;background:color-mix(in srgb,var(--blue) 25%,transparent)}
.ico i.on{background:var(--blue)}
.ent .what{flex:1;min-width:0}
.ent .t1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px}
.ent .t1 .dose{color:var(--label2);font-variant-numeric:tabular-nums}
.ent .t2{font-size:13px;color:var(--label2);margin-top:1px;overflow-wrap:anywhere}
.ent .t2 .off{color:var(--orange);font-weight:600}
.ent .chg{font-size:11px;font-weight:600;padding:1px 6px;border-radius:99px}
.ent .chg.up{color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.ent .chg.dn{color:var(--label2);background:var(--fill)}
.ent .ex{font-size:11px;font-weight:600;color:var(--orange);background:color-mix(in srgb,var(--orange) 15%,transparent);padding:1px 6px;border-radius:99px}
.ent .no{font-size:15px;color:var(--label2);white-space:nowrap;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.ent .chev{width:8px;height:13px;transition:transform .2s}
.ent.open .chev{transform:rotate(90deg)}
.del{display:block;width:100%;border:0;background:var(--card);color:var(--red);font-size:17px;padding:12px 16px;text-align:center;cursor:pointer;box-shadow:inset 0 .5px 0 var(--sep)}
.del.arm{background:var(--red);color:#fff;font-weight:600}
.empty{padding:22px 16px;text-align:center;color:var(--label2);font-size:15px;background:var(--card);border-radius:12px}

/* action list */
.list button.li{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:var(--card);padding:0 16px;min-height:46px;font-size:17px;color:var(--blue);cursor:pointer;text-align:left}
.list button.li:active{background:var(--fill2)}
.list button.li+button.li{border-top:.5px solid var(--sep)}
.list .chev{width:8px;height:13px;opacity:.35}
#importBox{padding:12px 16px 16px;border-top:.5px solid var(--sep);display:flex;flex-direction:column;gap:10px}
#importBox input[type=file]{font-size:15px;color:var(--label2)}
#importBox textarea{width:100%;min-height:90px;border:0;border-radius:10px;background:var(--fill2);color:var(--label);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
#importGo{height:44px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer}

.banner{font-size:15px;padding:12px 16px;background:var(--card);border-radius:12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.banner button{border:0;background:none;color:var(--blue);font-size:15px;padding:0;cursor:pointer}
.foot{font-size:13px;color:var(--label2);text-align:center;margin:28px 16px 0}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px) scale(.96);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--label);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px)}
.toast svg{width:18px;height:18px;flex:none;color:var(--green)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="nav" id="nav" aria-hidden="true"><div>針猛</div></div>
<div class="wrap">
  <p class="date" id="today"></p>
  <h1 id="bigTitle">針猛</h1>

  <div class="card" aria-label="目前狀態">
    <div class="sum">
      <div class="txt">
        <div class="k"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 0h1.5v2h5V0H12v2h1.5A2.5 2.5 0 0 1 16 4.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 0 13.5v-9A2.5 2.5 0 0 1 2.5 2H4V0Zm-2.5 6v7.5c0 .55.45 1 1 1h11c.55 0 1-.45 1-1V6h-13Z"/></svg>下次施打</div>
        <div class="big" id="nextDate">—</div>
        <div class="st" id="nextSub"></div>
      </div>
      <div class="ring" id="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="tr" cx="32" cy="32" r="27" fill="none" stroke-width="7"/><circle class="pr" id="ringP" cx="32" cy="32" r="27" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg><span id="ringT">—<small>天</small></span></div>
    </div>
    <div class="stats">
      <div><div class="k">目前劑量</div><div class="v" id="curDose">—</div></div>
      <div><div class="k">累計</div><div class="v" id="count">0<small>針</small></div></div>
    </div>
  </div>

  <div class="sec-h"><span>這一針</span><span id="pickSum"></span></div>
  <div class="card">
    <div class="pad"><div class="map" id="map" role="group" aria-label="施打部位"></div></div>
    <div class="seg-wrap">
      <p class="seg-l">劑量</p>
      <div class="seg" id="doses" role="group" aria-label="劑量"></div>
    </div>
    <div class="rows">
      <div class="frow"><label for="when">時間</label><input type="datetime-local" id="when"></div>
      <div class="frow"><label for="note">備註</label><input type="text" id="note" maxlength="80" placeholder="選填"></div>
    </div>
  </div>
  <p class="sec-f" id="recHint"></p>
  <button type="button" class="primary" id="save">記錄這一針</button>

  <div class="sec-h"><span>施打紀錄</span><button type="button" class="act" id="more" hidden></button></div>
  <div class="banner" id="exBanner" hidden><span>目前顯示範例資料</span><button type="button" id="clearEx">清除範例</button></div>
  <div class="banner" id="storeWarn" hidden><span>這個瀏覽器無法儲存資料（可能是無痕模式），關閉後紀錄會消失。</span></div>
  <ul class="log" id="log"></ul>
  <p class="sec-f">點一筆紀錄可以刪除。間隔少於 6 天或超過 8 天會以橘色標示。</p>

  <div class="sec-h"><span>備份與搬家</span></div>
  <div class="card list">
    <button type="button" class="li" id="exportBtn">匯出備份<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="li" id="importBtn">匯入備份<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="li" id="copyText">複製文字紀錄<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="importBox" hidden>
      <input type="file" id="importFile" accept=".json,application/json,text/plain" aria-label="選擇備份檔">
      <textarea id="importText" placeholder="或貼上備份內容" aria-label="備份內容"></textarea>
      <button type="button" id="importGo">匯入</button>
    </div>
  </div>
  <p class="sec-f">紀錄只存在這支手機。換手機前先匯出，到新手機再匯入。</p>

  <p class="foot" id="installHint" hidden>在 Safari 點「分享」→「加入主畫面」，就能像 App 一樣使用。</p>
  <p class="foot">劑量與施打方式請依醫師指示。</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="m5.5 10.3 3 3 6-6.3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="toastT"></span></div>

<script>
(function(){
  const SITES=[
    {id:'abu-l',name:'左上腹',row:'上腹',side:'左'},{id:'abu-r',name:'右上腹',row:'上腹',side:'右'},
    {id:'abl-l',name:'左下腹',row:'下腹',side:'左'},{id:'abl-r',name:'右下腹',row:'下腹',side:'右'}
  ];
  const ROWS=['上腹','下腹'];
  const DOSES=[2.5,5,7.5,10];
  const KEY='weekly-shot-log-v1';
  const DAY=86400000;
  const $=id=>document.getElementById(id);
  const LEGACY={'abd-l':'左腹部','abd-r':'右腹部','arm-l':'左上臂','arm-r':'右上臂','thi-l':'左大腿','thi-r':'右大腿'};
  const siteName=id=>(SITES.find(s=>s.id===id)||{}).name||LEGACY[id]||id;
  const CHEV='<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/></svg>';
  const CHECK='<svg class="ck" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#fff"/><path d="m5.5 10.3 3 3 6-6.3" fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---------- storage ----------
  let canStore=true, entries=null;
  try{const raw=localStorage.getItem(KEY); if(raw) entries=JSON.parse(raw);}catch(e){canStore=false}
  try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){canStore=false}
  if(!Array.isArray(entries)) entries=sampleData();
  function sampleData(){
    const base=new Date(Date.now()-3*DAY); base.setHours(20,30,0,0);
    const mk=(w,site,dose,note)=>({id:'ex'+w,t:base.getTime()-w*7*DAY,site,dose,note,ex:true});
    return [mk(0,'abl-r',5,''),mk(1,'abl-l',5,''),mk(2,'abu-r',2.5,''),mk(3,'abu-l',2.5,''),mk(4,'abl-r',2.5,'')];
  }
  function persist(){ if(!canStore) return; try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){canStore=false;$('storeWarn').hidden=false} }
  $('storeWarn').hidden=canStore;
  if(navigator.storage&&navigator.storage.persist){ try{navigator.storage.persist()}catch(e){} }
  const sorted=()=>entries.slice().sort((a,b)=>b.t-a.t);

  // ---------- helpers ----------
  const WD='日一二三四五六';
  const md=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()};
  const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
  const daysAgo=t=>Math.round((startOfDay(Date.now())-startOfDay(t))/DAY);
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function tap(){ if(navigator.vibrate){ try{navigator.vibrate(8)}catch(_){} } }
  function lastUse(){ const m={}; sorted().forEach(e=>{ if(!(e.site in m)) m[e.site]=e.t }); return m; }
  function recommend(){
    const m=lastUse(), last=sorted()[0];
    let best=null,bestT=Infinity;
    SITES.forEach(s=>{ if(last&&s.id===last.site)return; const t=m[s.id]??-Infinity; if(t<bestT){bestT=t;best=s} });
    return best||SITES[0];
  }

  // ---------- selection ----------
  const pick={site:0,dose:0};
  const selSite=()=>SITES[pick.site], selDose=()=>DOSES[pick.dose];

  // ---------- render ----------
  function renderStatus(){
    const list=sorted(), last=list[0];
    $('count').innerHTML=list.filter(e=>!e.ex).length+'<small>針</small>';
    const ring=$('ring'), sub=$('nextSub'), C=169.6;
    if(!last){ $('nextDate').textContent='—'; $('curDose').textContent='—'; sub.textContent='記錄第一針後開始計算'; sub.className='st'; $('ringT').innerHTML='—'; $('ringP').style.strokeDashoffset=C; return }
    $('curDose').innerHTML=last.dose+'<small>mg</small>';
    const next=last.t+7*DAY, nd=new Date(next);
    $('nextDate').innerHTML=md(next)+'<small>週'+WD[nd.getDay()]+'</small>';
    const diff=Math.round((startOfDay(next)-startOfDay(Date.now()))/DAY);
    const elapsed=Math.min(7,Math.max(0,7-diff));
    $('ringP').style.strokeDashoffset=C*(1-elapsed/7);
    ring.className='ring'; sub.className='st';
    if(diff>1){ sub.textContent='還有 '+diff+' 天'; $('ringT').innerHTML=diff+'<small>天後</small>' }
    else if(diff===1){ sub.textContent='明天'; sub.className='st warn'; ring.className='ring warn'; $('ringT').innerHTML='1<small>天後</small>' }
    else if(diff===0){ sub.textContent='今天該打了'; sub.className='st warn'; ring.className='ring warn'; $('ringT').innerHTML='今天' }
    else { sub.textContent='已超過 '+(-diff)+' 天'; sub.className='st bad'; ring.className='ring bad'; $('ringT').innerHTML='+'+(-diff)+'<small>天</small>' }
  }
  function renderPick(){
    const m=lastUse(), last=sorted()[0], rec=recommend(), sel=selSite();
    let h='';
    ROWS.forEach(row=>['左','右'].forEach(side=>{
      const s=SITES.find(x=>x.row===row&&x.side===side);
      const isLast=last&&s.id===last.site, isRec=s.id===rec.id, on=sel.id===s.id;
      const cls=['site']; if(isLast)cls.push('last'); else if(isRec)cls.push('rec'); if(on)cls.push('sel');
      const t=m[s.id], d=t==null?null:daysAgo(t);
      const meta=t==null?'還沒打過':(d===0?'今天打過':d+' 天前');
      const badge=isLast?'上次':(isRec?'建議':'');
      h+='<button type="button" class="'+cls.join(' ')+'" data-site="'+s.id+'" aria-pressed="'+on+'" aria-label="'+s.name+'，'+meta+(badge?'，'+badge:'')+'"><span class="nm">'+s.name+'</span><span class="m">'+meta+'</span>'+(badge?'<span class="badge">'+badge+'</span>':'')+CHECK+'</button>';
    }));
    $('map').innerHTML=h;
    const cur=selDose();
    $('doses').innerHTML=DOSES.map(d=>{const on=d===cur, prev=last&&last.dose===d;
      return '<button type="button" class="'+(on?'sel':'')+'" data-dose="'+d+'" aria-pressed="'+on+'" aria-label="'+d+' mg'+(prev?'，上次使用':'')+'">'+d+'<span class="u">mg</span>'+(prev&&!on?'<span class="dot"></span>':'')+'</button>'}).join('');
    $('pickSum').textContent=sel.name+' · '+cur+' mg';
    $('recHint').innerHTML=last?('上次打在<b>'+esc(siteName(last.site))+'</b>，建議這次換到<b>'+rec.name+'</b>。劑量上的小點是上次用的劑量。'):'第一針可以從<b>'+rec.name+'</b>開始。';
  }

  let showAll=false, openId=null;
  const SHOW_N=8;
  function ico(siteId){
    const i=SITES.findIndex(s=>s.id===siteId);
    let h='<span class="ico" aria-hidden="true">'; for(let k=0;k<SITES.length;k++) h+='<i'+(k===i?' class="on"':'')+'></i>'; return h+'</span>';
  }
  function renderLog(){
    const list=sorted();
    $('exBanner').hidden=!list.some(e=>e.ex);
    if(!list.length){ $('log').innerHTML='<li class="empty">還沒有紀錄。選好部位和劑量，按「記錄這一針」。</li>'; $('more').hidden=true; return }
    const num={}; list.slice().reverse().forEach((e,i)=>num[e.id]=i+1);
    const shown=showAll?list:list.slice(0,SHOW_N);
    const groups=[];
    shown.forEach(e=>{ const d=new Date(e.t), k=d.getFullYear()+'-'+d.getMonth(); let g=groups[groups.length-1]; if(!g||g.k!==k){ g={k,d,items:[]}; groups.push(g) } g.items.push(e) });
    let h='';
    groups.forEach(g=>{
      const cnt=list.filter(x=>{const y=new Date(x.t);return y.getFullYear()===g.d.getFullYear()&&y.getMonth()===g.d.getMonth()}).length;
      h+='<li class="mon"><span>'+g.d.getFullYear()+' 年 '+(g.d.getMonth()+1)+' 月</span><span>'+cnt+' 針</span></li><li><ul class="grp">';
      g.items.forEach(e=>{
        const d=new Date(e.t), prev=list[list.indexOf(e)+1];
        let gap='第一針', off=false;
        if(prev){ const n=Math.round((startOfDay(e.t)-startOfDay(prev.t))/DAY); gap='間隔 '+n+' 天'; off=n>=9||n<=5; }
        const chg=prev&&e.dose!==prev.dose?(e.dose>prev.dose?'<span class="chg up">加量</span>':'<span class="chg dn">減量</span>'):'';
        const open=openId===e.id;
        h+='<li class="ent'+(open?' open':'')+'"><button type="button" class="ent-main" data-open="'+esc(e.id)+'" aria-expanded="'+open+'">'+ico(e.site)
          +'<span class="what"><span class="t1"><span>'+esc(siteName(e.site))+'</span><span class="dose">'+e.dose+' mg</span>'+chg+(e.ex?'<span class="ex">範例</span>':'')+'</span>'
          +'<span class="t2">'+md(e.t)+' 週'+WD[d.getDay()]+' '+hm(e.t)+' · <span class="'+(off?'off':'')+'">'+gap+'</span>'+(e.note?' · '+esc(e.note):'')+'</span></span>'
          +'<span class="no">第 '+num[e.id]+' 針'+CHEV+'</span></button>'
          +(open?'<button type="button" class="del" data-del="'+esc(e.id)+'">刪除這筆紀錄</button>':'')+'</li>';
      });
      h+='</ul></li>';
    });
    $('log').innerHTML=h;
    $('more').hidden=list.length<=SHOW_N;
    $('more').textContent=showAll?'收合':'全部 '+list.length+' 筆';
  }
  function renderAll(){ renderStatus(); renderPick(); renderLog(); }

  // ---------- events ----------
  $('map').addEventListener('click',e=>{ const b=e.target.closest('[data-site]'); if(!b)return; tap(); pick.site=SITES.findIndex(s=>s.id===b.dataset.site); renderPick() });
  $('doses').addEventListener('click',e=>{ const b=e.target.closest('[data-dose]'); if(!b)return; tap(); pick.dose=DOSES.indexOf(+b.dataset.dose); renderPick() });

  function localInput(t){ const d=new Date(t); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16) }
  $('when').value=localInput(Date.now());

  $('save').addEventListener('click',()=>{
    const v=$('when').value; const t=v?new Date(v).getTime():Date.now();
    if(isNaN(t)){toast('請填入施打時間');return}
    const s=selSite(), d=selDose();
    entries=entries.filter(e=>!e.ex);
    entries.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t,site:s.id,dose:d,note:$('note').value.trim()});
    persist(); $('note').value=''; $('when').value=localInput(Date.now());
    pick.site=SITES.indexOf(recommend());
    renderAll(); toast('記好了，針猛！');
  });

  $('log').addEventListener('click',e=>{
    const del=e.target.closest('[data-del]');
    if(del){
      if(!del.classList.contains('arm')){ del.classList.add('arm'); del.textContent='再按一次確認刪除'; return }
      entries=entries.filter(x=>x.id!==del.dataset.del); openId=null; persist(); renderAll(); toast('已刪除'); return;
    }
    const row=e.target.closest('[data-open]'); if(!row)return;
    openId=openId===row.dataset.open?null:row.dataset.open; renderLog();
  });
  $('more').addEventListener('click',()=>{ showAll=!showAll; renderLog(); });
  $('clearEx').addEventListener('click',()=>{ entries=entries.filter(e=>!e.ex); persist(); renderAll(); toast('已清除範例'); });

  // ---------- backup ----------
  const realEntries=()=>entries.filter(e=>!e.ex);
  function backupJSON(){ return JSON.stringify({app:'weekly-shot',version:1,exported:new Date().toISOString(),entries:realEntries()}) }
  async function copy(txt,okMsg){
    try{ await navigator.clipboard.writeText(txt); toast(okMsg) }
    catch(e){ $('importBox').hidden=false; $('importText').value=txt; $('importText').select(); toast('請長按文字框手動複製') }
  }
  $('exportBtn').addEventListener('click',async()=>{
    const list=realEntries(); if(!list.length){toast('還沒有可以匯出的紀錄');return}
    const d=new Date(), name='針猛備份-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    const json=backupJSON();
    try{
      const file=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'針猛備份'}); return }
    }catch(e){ if(e&&e.name==='AbortError')return }
    try{
      const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000); toast('已匯出 '+list.length+' 筆');
    }catch(e){ copy(json,'已複製備份內容') }
  });
  $('importBtn').addEventListener('click',()=>{ $('importBox').hidden=!$('importBox').hidden });
  $('importFile').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ $('importText').value=String(r.result) }; r.readAsText(f);
  });
  $('importGo').addEventListener('click',()=>{
    let data; try{ data=JSON.parse($('importText').value.trim()) }catch(e){ toast('看不懂這份備份'); return }
    const list=Array.isArray(data)?data:(data&&data.entries);
    if(!Array.isArray(list)){ toast('備份裡找不到紀錄'); return }
    const ok=list.filter(x=>x&&typeof x.t==='number'&&x.site&&typeof x.dose==='number').map(x=>({id:String(x.id||('i'+x.t)),t:x.t,site:String(x.site),dose:x.dose,note:String(x.note||'').slice(0,80)}));
    const have=new Set(realEntries().map(x=>x.id));
    const add=ok.filter(x=>!have.has(x.id));
    entries=realEntries().concat(add); persist(); renderAll();
    $('importBox').hidden=true; $('importText').value=''; $('importFile').value='';
    toast('匯入 '+add.length+' 筆'+(ok.length>add.length?'，'+(ok.length-add.length)+' 筆已存在':''));
  });
  $('copyText').addEventListener('click',()=>{
    const txt=sorted().filter(e=>!e.ex).map(e=>{const d=new Date(e.t);return d.getFullYear()+'/'+md(e.t)+' '+hm(e.t)+'  '+siteName(e.site)+'  '+e.dose+' mg'+(e.note?'  '+e.note:'')}).join('\n');
    if(!txt){toast('還沒有紀錄');return}
    copy(txt,'已複製文字紀錄');
  });

  let tt=0; function toast(m){ $('toastT').textContent=m; const el=$('toast'); el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),1800) }

  // large title -> compact nav bar
  try{ new IntersectionObserver(([en])=>$('nav').classList.toggle('show',!en.isIntersecting),{rootMargin:'-44px 0px 0px 0px'}).observe($('bigTitle')) }catch(e){}

  function renderDate(){ const d=new Date(); $('today').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WD[d.getDay()]; }

  const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  $('installHint').hidden=!(ios&&!standalone);

  const last0=sorted()[0];
  pick.dose=last0?Math.max(0,DOSES.indexOf(last0.dose)):0;
  pick.site=SITES.indexOf(recommend());
  renderDate(); renderAll();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ renderDate(); renderAll() } });

  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
