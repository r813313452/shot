<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每週一針</title>
<meta name="description" content="記錄每週施打的時間、部位與劑量，用拉霸轉輪選部位並提示輪替。">
<meta name="theme-color" content="#F3F6F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E171B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每週一針">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --sunk:#E7EDEE; --fg:#14232A; --muted:#5B6E75;
  --line:#D3DDDF; --accent:#1F6F78; --accent-ink:#FFFFFF; --accent-soft:#D7ECEE;
  --gold:#C98A1B; --ok:#2E7D4F; --warn:#B26A00; --bad:#B23B3B;
  --reel-bg:#0F1D23; --reel-mid:#1c2f36; --reel-fg:#F2F7F7; --reel-dim:#6F858C; --reel-line:#2c444c;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E171B; --surface:#152228; --sunk:#1B2B32; --fg:#E6EEF0; --muted:#93A6AC;
  --line:#2A3C43; --accent:#5CB8C2; --accent-ink:#06262A; --accent-soft:#1B3A40;
  --gold:#E2A93F; --ok:#5CC287; --warn:#E6A23C; --bad:#E57373;
  --reel-bg:#070E11; --reel-mid:#14252b; --reel-dim:#5D7278; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-size:1.5rem;margin:0;letter-spacing:.02em}
h2{font-size:1rem;margin:0;font-weight:700;letter-spacing:.04em}
.sub{color:var(--muted);margin:2px 0 0;font-size:.88rem}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat .k{font-size:.75rem;color:var(--muted);letter-spacing:.08em}
.stat .v{font-family:var(--font-num);font-size:1.35rem;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.8rem;font-weight:500;color:var(--muted);margin-left:2px}
.pill{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;font-weight:500;margin-top:4px}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

.machine{background:var(--reel-bg);border-radius:18px;padding:14px;display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:stretch}
.reel-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.reel-label{color:var(--reel-dim);font-size:.72rem;letter-spacing:.14em;text-align:center}
.reel{position:relative;height:168px;overflow:hidden;border-radius:10px;background:linear-gradient(var(--reel-bg),var(--reel-mid) 50%,var(--reel-bg));outline:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.reel:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:56px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--reel-bg),transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,var(--reel-bg))}
.reel .win{position:absolute;left:4px;right:4px;top:56px;height:56px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);z-index:1;pointer-events:none;border-radius:4px}
.track{will-change:transform}
.cell{height:56px;display:flex;align-items:center;justify-content:center;color:var(--reel-fg);font-size:1.12rem;font-weight:700;white-space:nowrap}
.cell .u{font-size:.75rem;color:var(--reel-dim);margin-left:3px;font-weight:500}
.nudge{display:flex;gap:6px}
.nudge button{flex:1;background:transparent;border:1px solid var(--reel-line);color:var(--reel-fg);border-radius:8px;padding:4px 0;font-size:.8rem;cursor:pointer}
.lever{width:44px;display:flex;flex-direction:column;align-items:center;background:none;border:0;cursor:pointer;padding:0}
.lever .shaft{width:8px;height:120px;background:linear-gradient(90deg,#8a9aa0,#d9e2e4,#8a9aa0);border-radius:4px;transform-origin:50% 100%;transition:transform .25s ease-in;margin-top:22px;position:relative}
.lever .ball{position:absolute;top:-22px;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd98a,#C98A1B 55%,#8a5a06)}
.lever .base{width:30px;height:18px;border-radius:6px 6px 3px 3px;background:var(--reel-line);margin-top:-2px}
.lever .tag{color:var(--reel-dim);font-size:.7rem;letter-spacing:.1em;margin-top:6px}
.lever.pulled .shaft{transform:scaleY(-.55)}
.lever:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:8px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.hint b{color:var(--accent)}
.hint b.last{color:var(--bad)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);flex:1;min-width:140px}
input[type=datetime-local],input[type=text],textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-height:42px;-webkit-appearance:none;appearance:none}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 16px;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);width:100%;font-size:1rem}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line);font-weight:500;padding:7px 12px;font-size:.85rem}

.doses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dose-btn{position:relative;font:inherit;background:var(--sunk);color:var(--fg);border:2px solid transparent;border-radius:12px;min-height:52px;padding:8px 6px;cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:3px;transition:transform .1s}
.dose-btn:active{transform:scale(.97)}
.dose-btn .dv{font-family:var(--font-num);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.dose-btn .du{font-size:.75rem;color:var(--muted)}
.dose-btn .dp{position:absolute;top:3px;right:6px;font-size:.62rem;color:var(--muted)}
.dose-btn.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
#pickSum b{color:var(--fg)}
.pick-head{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:700;gap:10px;flex-wrap:wrap}
.pick-head .legend{font-weight:400}
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.site{position:relative;background:var(--sunk);border:2px solid transparent;border-radius:12px;padding:10px 12px;min-height:58px;cursor:pointer;text-align:left;font:inherit;color:var(--fg);min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;transition:transform .1s}
.site:active{transform:scale(.97)}
.site .nm{font-weight:700;font-size:1.05rem;line-height:1.3}
.site .m{font-size:.75rem;color:var(--muted)}
.site .badge{position:absolute;top:8px;right:10px;font-size:.7rem;font-weight:700;padding:0 7px;border-radius:99px}
.site.last .badge{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.site.rec .badge{color:var(--accent);background:var(--surface)}
.site.rec{background:var(--accent-soft)}
.site.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.site.sel .nm::after{content:" ✓";color:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.banner{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:8px 12px;font-size:.85rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{font:inherit;font-size:.8rem;background:none;border:1px solid var(--gold);color:var(--fg);border-radius:8px;padding:3px 10px;cursor:pointer}
.log{list-style:none;margin:0;padding:0}
.log .mon{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em;padding:14px 2px 6px;border-bottom:1px solid var(--line)}
.log .mon:first-child{padding-top:0}
.log .ent{border-bottom:1px solid var(--line)}
.log .ent.open{background:var(--sunk);border-radius:10px;border-bottom-color:transparent}
.ent-main{width:100%;display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:11px 6px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:10px}
.log .when{font-family:var(--font-num);line-height:1.25;font-variant-numeric:tabular-nums}
.log .when b{display:block;font-size:1.05rem}
.log .when span{font-size:.72rem;color:var(--muted)}
.log .what{min-width:0;display:flex;flex-direction:column;gap:2px}
.log .top{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.log .s{font-weight:700}
.log .dose{font-family:var(--font-num);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.log .sub2{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 8px;overflow-wrap:anywhere}
.log .gap.off{color:var(--warn);font-weight:700}
.log .nt::before{content:"・"}
.log .no{font-size:.72rem;color:var(--muted);white-space:nowrap}
.log .chg{font-size:.7rem;font-weight:700;border-radius:99px;padding:0 7px}
.log .chg.up{color:var(--accent);background:var(--accent-soft)}
.log .chg.dn{color:var(--muted);background:var(--sunk)}
.log .ex{font-size:.7rem;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:0 6px}
.mini{display:inline-grid;grid-template-columns:repeat(2,5px);gap:2px;flex:none}
.mini i{width:5px;height:5px;border-radius:1.5px;background:var(--line)}
.mini i.on{background:var(--accent)}
.acts{display:flex;justify-content:flex-end;padding:0 8px 10px}
.del{font:inherit;font-size:.82rem;background:var(--surface);border:1px solid var(--line);color:var(--bad);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.del.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
#more{align-self:center}
.empty{color:var(--muted);font-size:.9rem;text-align:center;padding:16px 0;display:block!important}

.backup{display:flex;gap:8px;flex-wrap:wrap}
.backup .btn{flex:1;min-width:120px}
#importBox textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.install{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{font-size:.78rem;color:var(--muted);text-align:center;margin:0}

@media (max-width:420px){
  .status{grid-template-columns:1fr 1fr}
  .status .stat:first-child{grid-column:1/-1}
  .machine{gap:8px;padding:12px}
  .cell{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){.lever .shaft,.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>每週一針</h1>
    <p class="sub">記下每次施打的時間、部位與劑量，並提醒你輪替部位。</p>
  </header>

  <section class="status" aria-label="目前狀態">
    <div class="stat"><div class="k">下次施打</div><div class="v" id="nextDate">—</div><span class="pill ok" id="nextPill" hidden></span></div>
    <div class="stat"><div class="k">目前劑量</div><div class="v" id="curDose">—</div></div>
    <div class="stat"><div class="k">累計針數</div><div class="v" id="count">0<small>針</small></div></div>
  </section>

  <section class="panel" aria-labelledby="pickH">
    <div class="row spread"><h2 id="pickH">這一針</h2><span class="hint" id="pickSum"></span></div>
    <div class="pick-head"><span>選擇部位</span><span class="legend"><span><i style="background:var(--accent)"></i>建議</span><span><i style="background:var(--bad)"></i>上次</span></span></div>
    <div class="map" id="map" role="group" aria-label="施打部位"></div>
    <p class="hint" id="recHint"></p>
    <div class="pick-head"><span>選擇劑量</span></div>
    <div class="doses" id="doses" role="group" aria-label="劑量"></div>
    <div class="row">
      <label class="f" for="when">施打時間<input type="datetime-local" id="when"></label>
      <label class="f" for="note">備註（選填）<input type="text" id="note" maxlength="80" placeholder="例如：有點瘀青、飯後"></label>
    </div>
    <button type="button" class="btn primary" id="save">記錄這一針</button>
  </section>

  <section class="panel" aria-labelledby="logH">
    <div class="row spread"><h2 id="logH">施打紀錄</h2></div>
    <div class="banner" id="exBanner" hidden><span>目前顯示的是範例資料，記錄第一針後會自動清除。</span><button type="button" id="clearEx">清除範例</button></div>
    <div class="banner" id="storeWarn" hidden><span>這個瀏覽器無法儲存資料（可能是無痕模式），關閉後紀錄會消失。</span></div>
    <ul class="log" id="log"></ul>
    <button type="button" class="btn ghost" id="more" hidden></button>
    <p class="hint">點一筆紀錄可以刪除。間隔少於 6 天或超過 8 天會以橘色標示。</p>
  </section>

  <section class="panel" aria-labelledby="bkH">
    <h2 id="bkH">備份與搬家</h2>
    <p class="hint">紀錄只存在這支手機。換手機前先匯出，到新手機再匯入。</p>
    <div class="backup">
      <button type="button" class="btn ghost" id="exportBtn">匯出備份</button>
      <button type="button" class="btn ghost" id="importBtn">匯入備份</button>
      <button type="button" class="btn ghost" id="copyText">複製文字紀錄</button>
    </div>
    <div id="importBox" hidden>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
        <input type="file" id="importFile" accept=".json,application/json,text/plain">
        <label class="f" for="importText">或貼上備份內容<textarea id="importText" placeholder='{"app":"weekly-shot",...}'></textarea></label>
        <button type="button" class="btn primary" id="importGo">匯入</button>
      </div>
    </div>
  </section>

  <p class="install" id="installHint" hidden>想像 App 一樣使用？在 Safari 點下方「分享」按鈕，選「加入主畫面」。</p>
  <p class="foot">紀錄只存在這支裝置。劑量與施打方式請依醫師指示。</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const SITES=[
    {id:'abu-l',name:'左上腹',row:'上腹',side:'左'},{id:'abu-r',name:'右上腹',row:'上腹',side:'右'},
    {id:'abl-l',name:'左下腹',row:'下腹',side:'左'},{id:'abl-r',name:'右下腹',row:'下腹',side:'右'}
  ];
  const ROWS=['上腹','下腹'];
  const DOSES=[2.5,5,7.5,10];
  const KEY='weekly-shot-log-v1';
  const DAY=86400000;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $=id=>document.getElementById(id);
  const LEGACY={'abd-l':'左腹部','abd-r':'右腹部','arm-l':'左上臂','arm-r':'右上臂','thi-l':'左大腿','thi-r':'右大腿'};
  const siteName=id=>(SITES.find(s=>s.id===id)||{}).name||LEGACY[id]||id;

  // ---------- storage ----------
  let canStore=true, entries=null;
  try{const raw=localStorage.getItem(KEY); if(raw) entries=JSON.parse(raw);}catch(e){canStore=false}
  try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t')}catch(e){canStore=false}
  if(!Array.isArray(entries)) entries=sampleData();
  function sampleData(){
    const base=new Date(Date.now()-3*DAY); base.setHours(20,30,0,0);
    const mk=(w,site,dose,note)=>({id:'ex'+w,t:base.getTime()-w*7*DAY,site,dose,note,ex:true});
    return [mk(0,'abl-r',5,'範例'),mk(1,'abl-l',5,''),mk(2,'abu-r',2.5,''),mk(3,'abu-l',2.5,''),mk(4,'abl-r',2.5,'第一針')];
  }
  function persist(){ if(!canStore) return; try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){canStore=false;$('storeWarn').hidden=false} }
  $('storeWarn').hidden=canStore;
  if(navigator.storage&&navigator.storage.persist){ try{navigator.storage.persist()}catch(e){} }
  const sorted=()=>entries.slice().sort((a,b)=>b.t-a.t);

  // ---------- selection ----------
  function Picker(items){ let i=0; return { get value(){return items[i]}, set(n){ i=n; renderPick() } }; }
  let reels=null;
  function renderPick(){
    if(!reels) return;
    renderMap();
    const cur=reels.dose.value, last=sorted()[0];
    $('doses').innerHTML=DOSES.map(d=>{const on=d===cur, prev=last&&last.dose===d;
      return '<button type="button" class="dose-btn'+(on?' sel':'')+'" data-dose="'+d+'" aria-pressed="'+on+'"><span class="dv">'+d+'</span><span class="du">mg</span>'+(prev?'<span class="dp">上次</span>':'')+'</button>'}).join('');
    $('pickSum').innerHTML='已選：<b>'+reels.site.value.name+'</b> · <b>'+cur+' mg</b>';
  }

  // ---------- logic ----------
  function lastUse(){ const m={}; sorted().forEach(e=>{ if(!(e.site in m)) m[e.site]=e.t }); return m; }
  function recommend(){
    const m=lastUse(), last=sorted()[0];
    let best=null,bestT=Infinity;
    SITES.forEach(s=>{ if(last&&s.id===last.site)return; const t=m[s.id]??-Infinity; if(t<bestT){bestT=t;best=s} });
    return best||SITES[0];
  }
  const WD='日一二三四五六';
  const md=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()};
  const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
  function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
  const daysAgo=t=>Math.round((startOfDay(Date.now())-startOfDay(t))/DAY);
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  function renderStatus(){
    const list=sorted(), last=list[0], pill=$('nextPill');
    const real=list.filter(e=>!e.ex).length;
    $('count').innerHTML=real+'<small>針</small>';
    if(!last){ $('nextDate').textContent='—'; $('curDose').textContent='—'; pill.hidden=true; return }
    $('curDose').innerHTML=last.dose+'<small>mg</small>';
    const next=last.t+7*DAY, nd=new Date(next);
    $('nextDate').innerHTML=md(next)+'<small>週'+WD[nd.getDay()]+'</small>';
    const diff=Math.round((startOfDay(next)-startOfDay(Date.now()))/DAY);
    pill.hidden=false;
    if(diff>1){pill.className='pill ok';pill.textContent='還有 '+diff+' 天'}
    else if(diff===1){pill.className='pill warn';pill.textContent='明天'}
    else if(diff===0){pill.className='pill warn';pill.textContent='今天該打了'}
    else {pill.className='pill bad';pill.textContent='已超過 '+(-diff)+' 天'}
  }
  function renderMap(){
    if(!reels) return;
    const m=lastUse(), last=sorted()[0], rec=recommend(), sel=reels.site.value;
    let h='';
    ROWS.forEach(row=>{
      ['左','右'].forEach(side=>{
        const s=SITES.find(x=>x.row===row&&x.side===side);
        const isLast=last&&s.id===last.site, isRec=s.id===rec.id;
        const cls=['site']; if(isLast)cls.push('last'); else if(isRec)cls.push('rec'); if(sel.id===s.id)cls.push('sel');
        const t=m[s.id]; const d=t==null?null:daysAgo(t);
        const meta=t==null?'還沒打過':(d===0?'今天打過':d+' 天前打過');
        const badge=isLast?'上次':(isRec?'建議':'');
        h+='<button type="button" class="'+cls.join(' ')+'" data-site="'+s.id+'" aria-pressed="'+(sel.id===s.id)+'" aria-label="'+s.name+'，'+meta+(badge?'，'+badge:'')+'"><span class="nm">'+s.name+'</span><span class="m">'+meta+'</span>'+(badge?'<span class="badge">'+badge+'</span>':'')+'</button>';
      });
    });
    $('map').innerHTML=h;
    $('recHint').innerHTML=last?('上次打在 <b class="last">'+siteName(last.site)+'</b>，建議這次換到 <b>'+rec.name+'</b>。'):'第一針可以從 <b>'+rec.name+'</b> 開始。';
  }
  let showAll=false, openId=null;
  const SHOW_N=8;
  function miniMap(siteId){
    const i=SITES.findIndex(s=>s.id===siteId);
    let h='<span class="mini" aria-hidden="true">'; for(let k=0;k<SITES.length;k++) h+='<i'+(k===i?' class="on"':'')+'></i>'; return h+'</span>';
  }
  function renderLog(){
    const list=sorted();
    $('exBanner').hidden=!list.some(e=>e.ex);
    if(!list.length){ $('log').innerHTML='<li class="empty">還沒有紀錄。選好部位和劑量，按「記錄這一針」。</li>'; $('more').hidden=true; return }
    const num={}; list.slice().reverse().forEach((e,i)=>num[e.id]=i+1);
    const shown=showAll?list:list.slice(0,SHOW_N);
    let h='',month='';
    shown.forEach(e=>{
      const d=new Date(e.t), mk=d.getFullYear()+'-'+d.getMonth();
      if(mk!==month){
        month=mk;
        const cnt=list.filter(x=>{const y=new Date(x.t);return y.getFullYear()===d.getFullYear()&&y.getMonth()===d.getMonth()}).length;
        h+='<li class="mon"><span>'+d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月</span><span>'+cnt+' 針</span></li>';
      }
      const prev=list[list.indexOf(e)+1];
      let gap='第一針', off=false;
      if(prev){ const g=Math.round((startOfDay(e.t)-startOfDay(prev.t))/DAY); gap='距上一針 '+g+' 天'; off=g>=9||g<=5; }
      let chg=''; if(prev&&e.dose!==prev.dose) chg=e.dose>prev.dose?'<span class="chg up">↑ 加量</span>':'<span class="chg dn">↓ 減量</span>';
      const open=openId===e.id;
      h+='<li class="ent'+(open?' open':'')+'">'
        +'<button type="button" class="ent-main" data-open="'+esc(e.id)+'" aria-expanded="'+open+'">'
        +'<span class="when"><b>'+md(e.t)+'</b><span>週'+WD[d.getDay()]+' '+hm(e.t)+'</span></span>'
        +'<span class="what"><span class="top">'+miniMap(e.site)+'<span class="s">'+esc(siteName(e.site))+'</span><span class="dose">'+e.dose+' mg</span>'+chg+(e.ex?'<span class="ex">範例</span>':'')+'</span>'
        +'<span class="sub2"><span class="'+(off?'gap off':'gap')+'">'+gap+'</span>'+(e.note?'<span class="nt">'+esc(e.note)+'</span>':'')+'</span></span>'
        +'<span class="no">第 '+num[e.id]+' 針</span></button>'
        +(open?'<div class="acts"><button type="button" class="del" data-del="'+esc(e.id)+'">刪除這筆</button></div>':'')
        +'</li>';
    });
    $('log').innerHTML=h;
    $('more').hidden=list.length<=SHOW_N;
    $('more').textContent=showAll?'只顯示最近 '+SHOW_N+' 筆':'顯示全部 '+list.length+' 筆';
  }
  function renderAll(){ renderStatus(); renderPick(); renderLog(); }

  // ---------- setup ----------
  reels={ site:Picker(SITES), dose:Picker(DOSES) };
  $('doses').addEventListener('click',e=>{ const b=e.target.closest('[data-dose]'); if(!b)return;
    if(navigator.vibrate){ try{navigator.vibrate(10)}catch(_){} }
    reels.dose.set(DOSES.indexOf(+b.dataset.dose)) });
  $('map').addEventListener('click',e=>{ const b=e.target.closest('[data-site]'); if(!b)return;
    if(navigator.vibrate){ try{navigator.vibrate(10)}catch(_){} }
    reels.site.set(SITES.findIndex(s=>s.id===b.dataset.site)) });

  function localInput(t){ const d=new Date(t); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16) }
  $('when').value=localInput(Date.now());

  $('save').addEventListener('click',()=>{
    const v=$('when').value; const t=v?new Date(v).getTime():Date.now();
    if(isNaN(t)){toast('請填入施打時間');return}
    entries=entries.filter(e=>!e.ex);
    entries.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t,site:reels.site.value.id,dose:reels.dose.value,note:$('note').value.trim()});
    persist(); $('note').value=''; $('when').value=localInput(Date.now());
    const savedName=reels.site.value.name, savedDose=reels.dose.value;
    reels.site.set(SITES.indexOf(recommend()));
    renderAll(); toast('已記錄：'+savedName+' '+savedDose+' mg');
  });

  $('log').addEventListener('click',e=>{
    const del=e.target.closest('[data-del]');
    if(del){
      if(!del.classList.contains('arm')){ del.classList.add('arm'); del.textContent='再按一次確認刪除'; return }
      entries=entries.filter(x=>x.id!==del.dataset.del); openId=null; persist(); renderAll(); toast('已刪除'); return;
    }
    const row=e.target.closest('[data-open]'); if(!row)return;
    openId=openId===row.dataset.open?null:row.dataset.open; renderLog();
  });
  $('more').addEventListener('click',()=>{ showAll=!showAll; renderLog(); });
  $('clearEx').addEventListener('click',()=>{ entries=entries.filter(e=>!e.ex); persist(); renderAll(); toast('已清除範例'); });

  // ---------- backup ----------
  const realEntries=()=>entries.filter(e=>!e.ex);
  function backupJSON(){ return JSON.stringify({app:'weekly-shot',version:1,exported:new Date().toISOString(),entries:realEntries()}) }
  async function copy(txt,okMsg){
    try{ await navigator.clipboard.writeText(txt); toast(okMsg) }
    catch(e){ $('importBox').hidden=false; $('importText').value=txt; $('importText').select(); toast('請長按文字框，手動複製') }
  }
  $('exportBtn').addEventListener('click',async()=>{
    const list=realEntries(); if(!list.length){toast('還沒有可以匯出的紀錄');return}
    const d=new Date(), name='每週一針備份-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    const json=backupJSON();
    try{
      const file=new File([json],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'每週一針備份'}); return }
    }catch(e){ if(e&&e.name==='AbortError')return }
    try{
      const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000); toast('已匯出 '+list.length+' 筆');
    }catch(e){ copy(json,'已複製備份內容，貼到備忘錄保存') }
  });
  $('importBtn').addEventListener('click',()=>{ $('importBox').hidden=!$('importBox').hidden });
  $('importFile').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ $('importText').value=String(r.result) }; r.readAsText(f);
  });
  $('importGo').addEventListener('click',()=>{
    let data; try{ data=JSON.parse($('importText').value.trim()) }catch(e){ toast('看不懂這份備份，請確認是從本 App 匯出的檔案'); return }
    const list=Array.isArray(data)?data:(data&&data.entries);
    if(!Array.isArray(list)){ toast('備份裡找不到紀錄'); return }
    const ok=list.filter(x=>x&&typeof x.t==='number'&&x.site&&typeof x.dose==='number').map(x=>({id:String(x.id||('i'+x.t)),t:x.t,site:String(x.site),dose:x.dose,note:String(x.note||'').slice(0,80)}));
    const have=new Set(realEntries().map(x=>x.id));
    const add=ok.filter(x=>!have.has(x.id));
    entries=realEntries().concat(add); persist(); renderAll();
    $('importBox').hidden=true; $('importText').value=''; $('importFile').value='';
    toast('匯入 '+add.length+' 筆'+(ok.length>add.length?'（'+(ok.length-add.length)+' 筆已存在）':''));
  });
  $('copyText').addEventListener('click',()=>{
    const txt=sorted().filter(e=>!e.ex).map(e=>{const d=new Date(e.t);return d.getFullYear()+'/'+md(e.t)+' '+hm(e.t)+'  '+siteName(e.site)+'  '+e.dose+' mg'+(e.note?'  '+e.note:'')}).join('\n');
    if(!txt){toast('還沒有紀錄');return}
    copy(txt,'已複製文字紀錄');
  });

  let tt=0; function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2000) }

  // install hint: iOS Safari, not yet on home screen
  const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  $('installHint').hidden=!(ios&&!standalone);

  const last0=sorted()[0];
  reels.dose.set(last0?Math.max(0,DOSES.indexOf(last0.dose)):0);
  reels.site.set(SITES.indexOf(recommend()));
  renderAll();

  // refresh "days" when app comes back to foreground
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ renderAll() } });

  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
